name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build + unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (npm ci, runs native installs for sharp and better-sqlite3)
        run: npm ci

      - name: Check native modules loaded
        run: |
          node -e "require('sharp'); console.log('sharp ok')"
          node -e "require('better-sqlite3'); console.log('better-sqlite3 ok')"

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test
