<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AugEngine — Smoke Cube</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #0a0c12; color: #e6e8ee;
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .shell {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100%;
      }
      header { padding: 12px 16px; border-bottom: 1px solid #1c1f2a; display: flex; gap: 12px; align-items: center; }
      header h1 { font-size: 14px; margin: 0; font-weight: 600; }
      header .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #1c1f2a; color: #9aa3b2; }
      main { position: relative; }
      canvas { width: 100%; height: 100%; display: block; }
      .controls { padding: 10px 16px; border-top: 1px solid #1c1f2a; display: flex; gap: 8px; align-items: center; }
      button {
        background: #2a2e3c; color: inherit; border: 1px solid #3a3f50;
        padding: 6px 14px; border-radius: 6px; cursor: pointer; font: inherit;
      }
      button:hover { background: #353a4a; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .metric { color: #9aa3b2; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
      .err { color: #ff6b6b; font-family: ui-monospace, monospace; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>AugEngine — smoke cube</h1>
        <span class="pill">Phase 1 MVP</span>
        <span class="metric" id="metric"></span>
      </header>
      <main><canvas id="stage"></canvas></main>
      <div class="controls">
        <button id="play">▶ Play (live)</button>
        <button id="render">⏺ Render 60 frames @ 30fps</button>
        <span class="metric" id="status"></span>
        <span class="err" id="err"></span>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
